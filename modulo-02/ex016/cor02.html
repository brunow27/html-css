<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient em CSS</title>
    <style>
        * { /* Configuração globais das CSS */
            height: 100%;
        }
        body {
            /*background-image: linear-gradient(to bottom, #425396, #0B3DFC, #100333); - Primeiro gradient com cores monocromáticas*/
            /*background-image: radial-gradient(circle, #3198E2, #6D59C0, #B93590, #E33F5F, #FDD579); - Gradient circular */
            background-image: linear-gradient(200deg, #3198E2, #6D59C0, #B93590, #E33F5F, #FDD579); /* Gradient do Instagram */
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Testando Gradient</h1>
</body>
